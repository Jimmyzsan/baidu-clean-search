<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>百度一下</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f8fa;
      --surface: rgba(255, 255, 255, 0.82);
      --text: #16181d;
      --muted: #7a7f89;
      --border: #d9dde5;
      --accent: #315efb;
      --accent-hover: #244ee5;
      --shadow: 0 18px 60px rgba(38, 48, 78, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111318;
        --surface: rgba(29, 32, 39, 0.88);
        --text: #f2f4f8;
        --muted: #999faa;
        --border: #3b404a;
        --accent: #6f8cff;
        --accent-hover: #8199ff;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      color: var(--text);
      background:
        radial-gradient(circle at 50% 22%, rgba(49, 94, 251, 0.12), transparent 34rem),
        var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      transform: translateY(-8vh);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      color: var(--text);
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border-radius: 17px;
      color: white;
      background: var(--accent);
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -0.08em;
      box-shadow: 0 10px 28px rgba(49, 94, 251, 0.28);
    }

    form {
      display: flex;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 14px 16px;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 18px;
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      min-width: 104px;
      border: 0;
      border-radius: 15px;
      padding: 0 22px;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      main {
        transform: translateY(-12vh);
      }

      form {
        border-radius: 18px;
      }

      input {
        width: 100%;
        padding: 13px 12px;
        font-size: 16px;
      }

      button {
        min-width: 84px;
        padding: 0 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://www.baidu.com/" aria-label="百度首页">
      <span class="mark" aria-hidden="true">百</span>
      <span>百度</span>
    </a>
    <form action="https://www.baidu.com/s" method="get" role="search">
      <input
        type="search"
        name="wd"
        maxlength="100"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="search"
        aria-label="搜索关键词"
        placeholder="输入搜索内容"
        autofocus
        required
      >
      <button type="submit">百度一下</button>
    </form>
    <p class="note">仅保留搜索入口，不加载资讯、热榜和广告。</p>
  </main>
</body>
</html>
